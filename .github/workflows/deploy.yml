name: Deploy StudySnap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ap-southeast-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build --template infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name studysnap \
            --s3-bucket ${{secrets.SAM_DEPLOY_BUCKET}} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Inject Lambda URLs into frontend
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name studysnap \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          URL=$(get_output BulletPointSummaryUrl)
          sed -i "s|__URL_BULLET_POINT_SUMMARY__|$URL|g" frontend/index.html

          URL=$(get_output FlashcardsUrl)
          sed -i "s|__URL_FLASHCARDS__|$URL|g" frontend/index.html

          URL=$(get_output KeyTermsGlossaryUrl)
          sed -i "s|__URL_KEY_TERMS_GLOSSARY__|$URL|g" frontend/index.html

          URL=$(get_output DifficultyTagLevelUrl)
          sed -i "s|__URL_DIFFICULTY_TAG_LEVEL__|$URL|g" frontend/index.html

          URL=$(get_output EstimatedStudyTimeUrl)
          sed -i "s|__URL_ESTIMATED_STUDY_TIME__|$URL|g" frontend/index.html

          URL=$(get_output RealWorldExamplesUrl)
          sed -i "s|__URL_REAL_WORLD_EXAMPLES__|$URL|g" frontend/index.html

          URL=$(get_output TopicVisualUrl)
          sed -i "s|__URL_TOPIC_VISUAL__|$URL|g" frontend/index.html

          URL=$(get_output InteractiveQuizUrl)
          sed -i "s|__URL_INTERACTIVE_QUIZ__|$URL|g" frontend/index.html

      - name: Deploy frontend to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name studysnap \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/ s3://$BUCKET/ --cache-control no-cache

      - name: Print website URL
        run: |
          WEBSITE=$(aws cloudformation describe-stacks \
            --stack-name studysnap \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" \
            --output text)
          echo "StudySnap is live at: $WEBSITE"
